[workspace]
members = [
    "crates/r3270-app",
    "crates/r3270-core",
    "crates/r3270-filetransfer",
    "crates/r3270-net",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["r3270 contributors"]

[workspace.dependencies]
anyhow = "1.0"
eframe = "0.34.2"
egui = "0.34.2"
rustls = "0.23"
rustls-pki-types = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1.0"

